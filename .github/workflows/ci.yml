name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        postgres: [16, 17, 18]

    env:
      PG_CONFIG: /usr/lib/postgresql/${{ matrix.postgres }}/bin/pg_config
      # Talk to our throwaway cluster over a unix socket in /tmp.
      PGHOST: /tmp
      PGPORT: "5432"
      DEBIAN_FRONTEND: noninteractive

    steps:
      - uses: actions/checkout@v4

      - name: Install GCC 15 (the C stubs use the C23 #embed directive)
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-15
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-15 100
          sudo update-alternatives --install /usr/bin/cc  cc  /usr/bin/gcc-15 100
          gcc --version

      - name: Install PostgreSQL ${{ matrix.postgres }}
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y \
            "postgresql-${{ matrix.postgres }}" \
            "postgresql-server-dev-${{ matrix.postgres }}"
          # The package auto-creates and starts a cluster on port 5432; drop it
          # so it doesn't collide with the throwaway cluster we start below.
          sudo pg_dropcluster --stop "${{ matrix.postgres }}" main || true

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.4"

      - name: Install dune
        run: opam install -y dune

      # with_llvm=no: the PGDG packages are built with JIT enabled, which makes
      # PGXS demand an LLVM bitcode file per module. PL/OCaml is an OCaml shared
      # object, not JIT-inlinable C, so we skip bitcode generation entirely.
      - name: Build
        run: opam exec -- make PG_CONFIG="$PG_CONFIG" with_llvm=no

      - name: Install extension
        # plocamlu.so is already up to date from the build step, so this only
        # copies files into the (root-owned) PostgreSQL install dirs.
        run: sudo make install PG_CONFIG="$PG_CONFIG" with_llvm=no

      - name: Start PostgreSQL
        run: |
          export PATH="/usr/lib/postgresql/${{ matrix.postgres }}/bin:$PATH"
          initdb -D "$RUNNER_TEMP/pgdata" -A trust
          pg_ctl -D "$RUNNER_TEMP/pgdata" -l "$RUNNER_TEMP/pg.log" \
            -o "-p $PGPORT -k /tmp -c listen_addresses=''" -w start

      - name: Run regression tests
        run: |
          if ! opam exec -- make installcheck PG_CONFIG="$PG_CONFIG" with_llvm=no; then
            echo '===== regression.diffs ====='
            cat regression.diffs 2>/dev/null || echo '(none)'
            exit 1
          fi

      - name: Show PostgreSQL log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/pg.log" 2>/dev/null || echo '(none)'

      - name: Upload regression artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-pg${{ matrix.postgres }}
          path: |
            regression.diffs
            results/
          if-no-files-found: ignore
